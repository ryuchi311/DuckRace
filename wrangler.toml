name = "duck-race"
main = "src/worker/index.js"
compatibility_date = "2025-04-01"

# Serve frontend HTML/JS/Audio from public directory at Cloudflare Edge
assets = { directory = "./public", binding = "ASSETS" }

# Optional Cloudflare D1 SQL Database Binding
# Create using: npx wrangler d1 create duck-race-db
[[d1_databases]]
binding = "DB"
database_name = "duck-race-db"
database_id = "cfa88ac9-cdd5-4f7d-9800-9b70601ecce6"

# Optional Cloudflare KV Database Binding (Fallback)
# [[kv_namespaces]]
# binding = "DUCK_ROOMS_KV"
# id = "your_kv_namespace_id"
